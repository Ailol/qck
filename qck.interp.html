<script>
'use strict';
const scene = document.querySelector('#workspace'), svg = document.querySelector('#field'), ns = 'http://www.w3.org/2000/svg';
const nodes = [
  {id:'L.nt',x:150,y:181,w:111,h:140}, {id:'K',x:105,y:359,w:96,h:110},
  {id:'G',x:261,y:321,w:70,h:85}, {id:'TF',x:246,y:396,w:85,h:100},
  {id:'R',x:385,y:415,w:90,h:90}, {id:'Gp',x:487,y:110,w:100,h:120},
  {id:'Zm',x:863,y:120,w:80,h:80}, {id:'N.pyr',x:815,y:410,w:120,h:90}
];
const edges = [[0,1],[0,2],[0,3],[1,2],[1,3],[2,4],[3,4]];
let drag = null, anchor = null, view = {level:2,time:0,current:''};
function element(tag, attrs, parent) {const el=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);parent.append(el);return el;}
nodes.forEach(n=>{n.el=element('g',{class:'qck-node',tabindex:0,role:'button','aria-label':n.id+' node'},document.querySelector('#nodes'));n.rect=element('rect',{width:n.w,height:n.h,rx:1},n.el);element('text',{x:n.w/2,y:n.h/2,'text-anchor':'middle','dominant-baseline':'middle'},n.el).textContent=n.id;element('circle',{class:'anchor',cx:0,cy:n.h,r:2.3},n.el);n.el.addEventListener('pointerdown',e=>{if(view.level<2)return;const p=point(e);drag={n,x:p.x-n.x,y:p.y-n.y};n.el.setPointerCapture(e.pointerId);if(view.level===4){anchor=n.id;draw();}});n.el.addEventListener('keydown',e=>{if(view.level<2)return;const step=e.shiftKey?10:3;const moves={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]};if(moves[e.key]){e.preventDefault();n.x=Math.max(8,Math.min(1071-n.w,n.x+moves[e.key][0]));n.y=Math.max(8,Math.min(560-n.h,n.y+moves[e.key][1]));draw();}if((e.key==='Enter'||e.key===' ')&&view.level===4){e.preventDefault();anchor=n.id;draw();}});});
const paths=edges.map(()=>element('path',{},document.querySelector('#fabric')));
const dots=edges.map(()=>element('circle',{class:'particle',r:2},document.querySelector('#particles')));
function point(event){const p=svg.createSVGPoint();p.x=event.clientX;p.y=event.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
svg.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),n=drag.n;n.x=Math.max(8,Math.min(1071-n.w,p.x-drag.x));n.y=Math.max(8,Math.min(560-n.h,p.y-drag.y));draw();});
svg.addEventListener('pointerup',()=>{drag=null;});svg.addEventListener('pointercancel',()=>{drag=null;});svg.addEventListener('lostpointercapture',()=>{drag=null;});
function draw(){
  nodes.forEach(n=>{n.el.setAttribute('transform','translate('+n.x+' '+n.y+')');n.el.setAttribute('tabindex',view.level<2?-1:0);n.el.classList.toggle('is-current',view.level===4&&anchor===n.id);});
  edges.forEach(([a,b],i)=>{const A=nodes[a],B=nodes[b],x1=A.x+A.w/2,y1=A.y+A.h,x2=B.x,y2=B.y+B.h/2;const bend=Math.max(22,Math.abs(x2-x1)*.5);paths[i].setAttribute('d','M'+x1+','+y1+' C'+x1+','+(y1+bend)+' '+(x2-bend)+','+y2+' '+x2+','+y2);const p=paths[i].getPointAtLength(paths[i].getTotalLength()*((view.time/100+i*.13)%1));dots[i].setAttribute('cx',p.x);dots[i].setAttribute('cy',p.y);});
  document.querySelector('#view-name').textContent=view.level+'d · '+['fabric','spatial','time','current'][view.level-1];
  const notes=['One fabric. Connections stay visible.','Move a node. Keep its connections.','Scrub or play the time vector along the same connections.',(anchor?'Anchor '+anchor+'. ':'')+(view.current||'Choose an anchor and set your current context.')];
  document.querySelector('#view-note').textContent=notes[view.level-1];
  document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.level)===view.level)));
}
scene.addEventListener('qck:interp',event=>{view=event.detail;draw();});
const controls=qck.interp.mount(document.querySelector('#controls'),{target:scene});
document.querySelectorAll('[data-level]').forEach(button=>button.addEventListener('click',()=>controls.set({level:Number(button.dataset.level)})));
window.qckDemo={controls,nodes};
</script>
